<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 150 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="terminal-prompt">
        <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="홈으로 이동">
          <span class="prompt-user">{{ site.author }}</span><span class="prompt-at">@</span><span class="prompt-host">sec</span><span class="prompt-path">:~$</span>
        </a>
        <form class="terminal-form" aria-label="블로그 터미널">
          <label class="terminal-command-field">
            <span class="sr-only">터미널 명령어 입력</span>
            <input class="terminal-input" type="text" name="command" aria-label="터미널 명령어" placeholder=" " autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
            <span class="cursor" aria-hidden="true"></span>
          </label>
          <button class="sr-only" type="submit">명령어 실행</button>
        </form>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">글</a>
        <a href="{{ '/categories/' | relative_url }}">카테고리</a>
        <a href="{{ '/about/' | relative_url }}">소개</a>
      </nav>
    </div>
    <div class="terminal-output" role="region" aria-label="터미널 실행 결과" tabindex="0" hidden>
      <ol class="wrap terminal-history" role="log" aria-live="polite" aria-relevant="additions"></ol>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <a href="https://github.com/{{ site.author }}" rel="noopener">GitHub</a>
    </div>
  </footer>
  <script src="{{ '/assets/js/terminal.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
