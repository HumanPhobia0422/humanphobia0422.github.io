# 사이트 기본 정보 — 여기만 수정해도 블로그 전체에 반영됩니다
title: HumanPhobia0422
tagline: 보안 공부 기록
description: 시스템 해킹, 웹 해킹, 리버싱 등 보안 공부를 정리하는 블로그입니다.
url: "https://humanphobia0422.github.io"
author: HumanPhobia0422

# 빌드 설정 (건드리지 않아도 됩니다)
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

kramdown:
  syntax_highlighter: rouge

# 글에 기본 레이아웃 자동 적용
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - scripts
  - .githooks
  - .github
  - .gitignore
  - .env
  - .env.local
  - .env.production
  - .aws
  - .ssh
  - .codex
  - private
  - secrets
  - credentials.json
  - secrets.json
  - work
  - outputs

# 글이 없어도 표시할 카테고리
category_list:
  - "개발"
  - "CTF/Wargame"
  - "Bug Bounty"
  - "블로그/기술문서"
  - "논문/컨퍼런스"
  - "공모전/자격증"
